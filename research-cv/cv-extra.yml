        - Selected for the International Collaboration Support Program (2025), POSTECH Overseas Dispatch Support Program (2025.05.16), and KICS Pre-Ph.D. Research Support Program (2025.03.13).
    - label: Professional experience
      text: Postdoctoral researcher at Seoul National University; visiting scholar at The University of Texas at Austin with Prof. Kaushik Chowdhury; Ph.D. from POSTECH under Prof. Hyun Jong Yang.
  field_of_interest:
