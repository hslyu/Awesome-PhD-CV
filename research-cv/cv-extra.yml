    - label: Academic honors & awards
      items:
        - The 32nd Humantech Paper Awards, Samsung, 2026.02.11 — 120 awardees (120 out of 3,172, 3.8%).
        - Main Track Best Paper Award, IEEE ICTC, 2025.10.16 — 8 awardees (8 out of 734, 1.1%).
        - Best Paper Award, KICS, 2024.11.23 — 24 awardees (24 out of 930, 2.6%).
        - Patent Competition Grand Prize, POSTECH and KIPA, 2024.01.28 — 1st place (1 out of 39, 2.6%); associated patent application KR 10-2024-0045157.
        - Best Paper Award, Korea Aerospace Industries (KAI), 2022.11.24 — one of 9 award-winning teams nationwide.
    - label: Research fellowships
